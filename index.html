<!DOCTYPE html>
<html>
<head>
  <title>Livery Generator PoC</title>
</head>
<body>
  <h2>BMW M4 GT3 Livery Generator</h2>
  <label>Livery Prompt:</label>
  <input type="text" id="prompt" placeholder="e.g., white base with red and blue stripes">
  <button onclick="generate()">Generate</button>
  <div id="results"></div>

  <script>
    function generate() {
      const prompt = document.getElementById("prompt").value;
      const output = document.getElementById("results");
      output.innerHTML = `<p><b>Prompt:</b> ${prompt}</p>
      <p>[Here we would display the car + template based on this prompt]</p>`;
    }
  </script>
</body>
</html>
